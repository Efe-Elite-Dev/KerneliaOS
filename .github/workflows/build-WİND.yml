name: KerneliaOS Quantum Engine CI/CD

# Workflow'un ne zaman çalışacağını belirliyoruz (Kodu pushladığında otomatik başlar)
on:
  push:
    branches: [ "main", "master", "feature/**" ]   # feature dallari da derlenir (ISO artifact)
    tags: [ "v*" ]              # v18.1 gibi bir etiket gonderilince sürüm olusturulur
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repoyu Sunucuya Çek
      uses: actions/checkout@v4 # GitHub'ın yeni V4 altyapısına güncellendi!

    - name: 🛠️ Gerekli Derleyici Araçlarını (Toolchain) Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-multilib mtools xorriso grub-pc-bin grub-common qemu-system-x86

    - name: 🛡️ Font ve multiboot doğrulaması
      run: |
        # Metin aramasi yerine: font bit sirasi ve kernel'in grafik dogrulamasi gercekten var mi?
        grep -q "1<<col" kernel.c || { echo "HATA: font bit sirasi (LSB-solda) bulunamadi"; exit 1; }
        grep -q "framebuffer_type != 1" kernel.c || { echo "HATA: framebuffer tipi dogrulamasi yok"; exit 1; }
        echo "OK: font ve framebuffer dogrulamalari mevcut"

    - name: ⚙️ Bootloader'ı Derle (boot.asm)
      run: nasm -f elf32 boot.asm -o boot.o

    - name: 🧠 Çekirdeği Derle (kernel.c)
      run: gcc -m32 -ffreestanding -fno-builtin -fno-stack-protector -fno-pie -O2 -Wall -c kernel.c -o kernel.o

    - name: 🔗 Sistemi Bağla (Linker)
      run: ld -m elf_i386 -z noexecstack -T linker.ld boot.o kernel.o -o kernel.bin

    - name: 🧪 Host testleri (bellek ayiricisi, DNS ayristirici)
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-function -o test_mem app/test/test_mem.c && ./test_mem
        gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-function -o test_dns app/test/test_dns.c && ./test_dns
        gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-function -o test_crypto app/test/test_crypto.c && ./test_crypto
        gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-function -o test_x25519 app/test/test_x25519.c && ./test_x25519
        gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-function -o test_tls app/test/test_tls.c && ./test_tls
        gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-function -o test_rsa app/test/test_rsa.c && ./test_rsa

    - name: ✅ Multiboot başlığını doğrula
      run: grub-file --is-x86-multiboot kernel.bin

    - name: 🖥️ QEMU testleri (cekirdek ici testler, panik dokumu, cikis kodlari)
      run: bash tools/qemu_test.sh

    - name: 💿 Önyüklenebilir ISO Dosyası Oluştur (VirtualBox İçin)
      run: |
        mkdir -p isodir/boot/grub
        cp kernel.bin isodir/boot/
        
        # GRUB menü dosyasını otomatik oluşturuyoruz
        cat <<EOF > isodir/boot/grub/grub.cfg
        menuentry "KerneliaOS 18.1" {
            multiboot /boot/kernel.bin
        }
        EOF
        
        grub-mkrescue -o KerneliaOS-Quantum.iso isodir

    - name: 🚀 Derlenen Kusursuz İşletim Sistemini Yükle (Artifact)
      uses: actions/upload-artifact@v4 # GitHub'ın yeni V4 altyapısına güncellendi!
      with:
        name: KerneliaOS-Quantum-ISO
        path: KerneliaOS-Quantum.iso

    - name: 💾 Test disk imajı oluştur (FAT16 + HELLO.WIND)
      run: python3 app/test/make_disk.py KerneliaOS-Disk.img

    - name: 💾 Disk imajını yükle (QEMU -hda ile denemek için)
      uses: actions/upload-artifact@v4
      with:
        name: KerneliaOS-Disk-IMG
        path: KerneliaOS-Disk.img

  release:
    name: 🏷️ Surum Yayinla (main veya etiket)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - name: 📥 Repoyu Sunucuya Çek
      uses: actions/checkout@v4

    - name: 💿 Derlenen ISO'yu indir
      uses: actions/download-artifact@v4
      with:
        name: KerneliaOS-Quantum-ISO
        path: release

    - name: 🚀 Surumu olustur veya guncelle (ISO + run.bat)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          TAG="$GITHUB_REF_NAME"
          TITLE="KerneliaOS $TAG"
        else
          # main'e her birlesmede ayni "latest-build" surumu yenilenir
          TAG="latest-build"
          TITLE="KerneliaOS son derleme (main)"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
        fi
        NOTES="ISO ve run.bat. Windows'ta ISO'yu run.bat dosyasinin uzerine surukleyin (QEMU gerekir). Kaynak: $GITHUB_SHA"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" release/KerneliaOS-Quantum.iso run.bat --clobber
        else
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" release/KerneliaOS-Quantum.iso run.bat
        fi
