name: WindOS Quantum Engine CI/CD

# Workflow'un ne zaman çalışacağını belirliyoruz (Kodu pushladığında otomatik başlar)
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]              # v18.1 gibi bir etiket gonderilince sürüm olusturulur
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repoyu Sunucuya Çek
      uses: actions/checkout@v4 # GitHub'ın yeni V4 altyapısına güncellendi!

    - name: 🛠️ Gerekli Derleyici Araçlarını (Toolchain) Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc-multilib mtools xorriso grub-pc-bin grub-common

    - name: 🛡️ Font ve multiboot doğrulaması
      run: |
        # Metin aramasi yerine: font bit sirasi ve kernel'in grafik dogrulamasi gercekten var mi?
        grep -q "1<<col" kernel.c || { echo "HATA: font bit sirasi (LSB-solda) bulunamadi"; exit 1; }
        grep -q "framebuffer_type != 1" kernel.c || { echo "HATA: framebuffer tipi dogrulamasi yok"; exit 1; }
        echo "OK: font ve framebuffer dogrulamalari mevcut"

    - name: ⚙️ Bootloader'ı Derle (boot.asm)
      run: nasm -f elf32 boot.asm -o boot.o

    - name: 🧠 Çekirdeği Derle (kernel.c)
      run: gcc -m32 -ffreestanding -fno-builtin -fno-stack-protector -fno-pie -O2 -Wall -c kernel.c -o kernel.o

    - name: 🔗 Sistemi Bağla (Linker)
      run: ld -m elf_i386 -z noexecstack -T linker.ld boot.o kernel.o -o kernel.bin

    - name: ✅ Multiboot başlığını doğrula
      run: grub-file --is-x86-multiboot kernel.bin

    - name: 💿 Önyüklenebilir ISO Dosyası Oluştur (VirtualBox İçin)
      run: |
        mkdir -p isodir/boot/grub
        cp kernel.bin isodir/boot/
        
        # GRUB menü dosyasını otomatik oluşturuyoruz
        cat <<EOF > isodir/boot/grub/grub.cfg
        menuentry "WindOS 18.1" {
            multiboot /boot/kernel.bin
        }
        EOF
        
        grub-mkrescue -o WindOS-Quantum.iso isodir

    - name: 🚀 Derlenen Kusursuz İşletim Sistemini Yükle (Artifact)
      uses: actions/upload-artifact@v4 # GitHub'ın yeni V4 altyapısına güncellendi!
      with:
        name: WindOS-Quantum-ISO
        path: WindOS-Quantum.iso

  release:
    name: 🏷️ Surum Yayinla (etiket)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Repoyu Sunucuya Çek
      uses: actions/checkout@v4

    - name: 💿 Derlenen ISO'yu indir
      uses: actions/download-artifact@v4
      with:
        name: WindOS-Quantum-ISO
        path: release

    - name: 🚀 Surumu olustur (ISO + run.bat)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "WindOS $GITHUB_REF_NAME" \
          --notes "Otomatik surum: ISO ve run.bat. Windows'ta ISO'yu run.bat dosyasinin uzerine surukleyin (QEMU gerekir)." \
          release/WindOS-Quantum.iso run.bat
